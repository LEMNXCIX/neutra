version: '3.4'

services:
  ecommerce:
    image: ecommerce
    build:
      # Monorepo root is the build context; the API Dockerfile lives under
      # apps/api. Run with: docker compose -f apps/api/docker-compose.debug.yml up
      context: ../../
      dockerfile: apps/api/Dockerfile.dev
    env_file:
      - ./.env
    environment:
      NODE_ENV: development
    ports:
      - 3000:3000
      - 9229:9229
    command: ["bun", "--inspect=0.0.0.0:9229", "run", "--cwd", "apps/api", "dev"]
