name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    # Job-level so `bun install --frozen-lockfile` postinstall (prisma
    # generate) also gets a URL: prisma.config.ts refuses to boot without it.
    # The DB and Redis below are contacted for migrations, the seed and the
    # integration suites, which the ci profile now runs as a blocking check.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      JWT_SECRET: ci-secret
      SESSION_SECRET: ci-secret
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci
      POSTGRES_DB: ci
      # prisma/seed.ts refuses to run without this one: it throws
      # "SUPER_ADMIN_PASSWORD is required" rather than seeding an account
      # nobody could sign into. It has no default, unlike SUPER_ADMIN_EMAIL.
      # A throwaway credential for a database that lives only as long as the
      # job, on the same footing as JWT_SECRET above.
      SUPER_ADMIN_PASSWORD: ci-super-admin-password
      # The web server resolves its backend per request and refuses to boot a
      # request without this. A throwaway value is enough: the CI smoke hits the
      # non-static router path /api/revalidate/events plus a separate static
      # /icon.svg artifact check, and the parity suite mocks every backend call.
      BACKEND_API_URL: http://localhost:4001/api
      # TENANT_TRUST_HOST_ONLY is intentionally NOT set in CI: it is a
      # production-only hardening flag. The API integration suites authenticate
      # with x-tenant-slug headers by design; Host-only is covered by unit tests.
      # docker-compose.prod.yml declares these five with `:?`, and the API
      # doctor's blocking `docker.compose` check validates both compose files.
      # The CMS is excluded from the root build, so throwaway values are enough
      # for `docker compose config --quiet`; no CMS service is started here.
      CMS_APP_KEYS: ci-cms-app-keys
      CMS_API_TOKEN_SALT: ci-cms-api-token-salt
      CMS_ADMIN_JWT_SECRET: ci-cms-admin-jwt-secret
      CMS_JWT_SECRET: ci-cms-jwt-secret
      CMS_ENCRYPTION_KEY: ci-cms-encryption-key
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      # Jest transform cache: not covered by setup-node's cache. Restoring it
      # avoids recompiling ~500 TS files on every CI run. Keyed on the single
      # bun.lock kept at the monorepo root.
      - name: Cache Jest transforms
        uses: actions/cache@v4
        with:
          path: .jest-cache
          key: ${{ runner.os }}-jest-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-jest-${{ hashFiles('bun.lock') }}-
            ${{ runner.os }}-jest-

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      # setup-node cannot cache Bun's store (only npm/yarn/pnpm). Cache it
      # explicitly with actions/cache, keyed on the single root bun.lock.
      - name: Cache Bun store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run --cwd apps/api prisma generate

      # `migrate deploy` applies the committed migrations and never resets a
      # database, which is the right verb for a CI database.
      - name: Apply database migrations
        run: bun run --cwd apps/api prisma migrate deploy

      # Not optional: the integration suites resolve their tenant from the
      # seeded `superadmin` slug (test/test-client.ts), so without reference
      # data every request 404s on the tenant lookup and the suites report a
      # green run against an empty database.
      - name: Seed reference data
        run: bun run --cwd apps/api prisma db seed

      # C1: commons:check hard-fails unless packages/commons/dist exists, but
      # dist/ is gitignored and no postinstall builds commons. Build the shared
      # contracts explicitly first so the guard passes from a clean checkout.
      - name: Build shared contracts
        run: bun run --cwd packages/commons build

      # The web app's serve-start-static.test.ts resolves dist/client/icon.svg,
      # which is gitignored and only produced by a web build. turbo's
      # `test.dependsOn: ["^build"]` builds dependencies (commons) but not web
      # itself, so the root `Test` step below would otherwise fail on a fresh
      # checkout. Build web here, before any typecheck or test step.
      - name: Build web app
        run: bun run --cwd apps/web build

      # Root-level drift guards run before typecheck/test so a contract or
      # architecture regression fails fast with a precise message.
      - name: Check shared contracts drift
        run: bun run commons:check

      # Fail fast if a wire contract was redefined inside apps/web/src instead
      # of being imported from @neutra/commons (same guard as verify-web-dod).
      - name: Check web contract duplication
        run: node scripts/verify-web-contracts.mjs

      # Task 9 acceptance gate: commons dist is already built above and no
      # generated source has been written yet, so the clean-tree check passes.
      - name: Verify availability DoD acceptance criteria
        run: node scripts/verify-availability-dod.mjs

      - name: Check architecture boundaries
        run: bun run check:arch

      # The npm lockfile pinned @types/express-serve-static-core 5.1.0; the
      # root `overrides` keeps that pin under bun too, so req.params stays
      # `string` and the API typecheck is green and blocking.
      - name: Typecheck
        run: bun run typecheck

      # --include-integration is what makes the integration check run at all;
      # without it the ci profile skips the eight database-backed suites, which
      # is how a broken assertion in test/slide.test.ts survived unnoticed.
      - name: Test
        run: bun run test

      - name: API Doctor
        run: bun run doctor:api -- --profile ci --include-integration --format text

      # ---------- Web workspace gates ----------
      # Install, shared-contract build and web build are already done above;
      # these steps only consume those artifacts.
      - name: Web typecheck
        run: bun run --cwd apps/web typecheck

      - name: Web test
        run: bun run --cwd apps/web test

      # Re-run the parity inventory on its own so a route/fixture drift is a
      # visibly separate gate rather than buried in the full suite output.
      - name: Web parity (route inventory)
        run: bun run --cwd apps/web test tests/parity/

      # Boot the built Node adapter, then run two distinct checks:
      #  1. artifact: /icon.svg exists only after the web build (static layer);
      #  2. router: /api/revalidate/events is NOT a static file, so
      #     serve-start.mjs forwards it to entry.fetch. Tenant resolution runs
      #     there before the stream opens. The root host is the only tenant
      #     that resolves without a backend in CI. The x-tenant-* headers are
      #     sent too, though the server derives identity from Host and
      #     overwrites them (forged headers are never trusted).
      - name: Web smoke (tenant headers)
        run: |
          bun run --cwd apps/web start:start &
          WEB_PID=$!
          trap 'kill $WEB_PID 2>/dev/null || true' EXIT

          # 1. Artifact check (static path).
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null \
              -H "x-tenant-slug: superadmin" \
              -H "x-tenant-id: t1" \
              http://localhost:3001/icon.svg; then
              break
            fi
            sleep 1
          done
          curl -fsS \
            -H "x-tenant-slug: superadmin" \
            -H "x-tenant-id: t1" \
            http://localhost:3001/icon.svg

          # 2. Router-path check. This endpoint streams forever, so curl times
          # out AFTER the 200 headers arrive; %{http_code} still reports the
          # real status. `|| true` only absorbs that timeout - a dead server
          # yields 000 and still fails the assertion below.
          status=000
          for i in $(seq 1 10); do
            status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 3 \
              -H "x-tenant-slug: superadmin" \
              -H "x-tenant-id: t1" \
              http://localhost:3001/api/revalidate/events 2>/dev/null) || true
            [ "$status" = "200" ] && break
            sleep 1
          done
          echo "router-path status: $status"
          test "$status" = "200"
